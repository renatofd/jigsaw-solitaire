<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1838" />
    <meta name="application-name" content="Jigsaw Cards" />
    <meta name="apple-mobile-web-app-title" content="Jigsaw Cards" />
    <title>Jigsaw Cards</title>
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Tela inicial: mapa de fases em forma de cartas -->
    <section id="home" class="screen">
      <header class="topbar">
        <div class="icons">
          <button id="btn-settings" class="icon-btn" data-i18n-aria="settings" aria-label="Configurações">
            <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          </button>
          <button id="btn-gallery" class="icon-btn" data-i18n-aria="collection" aria-label="Coleção">
            <svg viewBox="0 0 24 24"><rect x="7" y="3" width="11" height="17" rx="2"/><path d="M5 6.5 3.5 7l2.7 12.5L9 19"/><path d="m12.5 7.8.8 1.7 1.8.2-1.3 1.3.3 1.8-1.6-.9-1.6.9.3-1.8-1.3-1.3 1.8-.2Z"/><path d="M10 15h5M10 17.5h5"/></svg>
          </button>
        </div>
      </header>
      <nav class="theme-bar" aria-label="Tema">
        <button id="btn-theme-prev" class="arrow-btn" data-i18n-aria="prevTheme" aria-label="Tema anterior"><svg viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></svg></button>
        <div class="theme-name">
          <h1 id="theme-title">Paisagens</h1>
          <p id="theme-progress">0 de 10</p>
        </div>
        <button id="btn-theme-next" class="arrow-btn" data-i18n-aria="nextTheme" aria-label="Próximo tema"><svg viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7"/></svg></button>
      </nav>
      <div id="level-grid" class="level-grid"><div id="level-cards" class="level-cards"></div></div>
      <footer class="home-footer">
        <button id="btn-play" class="play-btn">Nível 1</button>
      </footer>
    </section>

    <!-- Tela de jogo -->
    <section id="game" class="screen" hidden>
      <header class="topbar">
        <button id="btn-back" class="icon-btn" data-i18n-aria="back" aria-label="Voltar">
          <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <div class="pill" id="level-pill">Nível 1</div>
        <button id="btn-hint" class="hint-btn" data-i18n-aria="hint" aria-label="Dica">
          <svg viewBox="0 0 24 24"><path class="bulb" d="M9 18h6v-1.5c0-1 .5-1.8 1.3-2.6A6 6 0 1 0 7.7 14c.8.8 1.3 1.6 1.3 2.6Z"/><path class="bolt" d="m12.8 6.5-2.6 4.3h2.4l-1.4 3.7 3.4-4.8h-2.5l1.3-3.2Z"/><path class="base" d="M9.5 19.5h5M10.5 21.5h3"/></svg>
          <span id="hint-count" class="badge">3</span>
        </button>
      </header>
      <div id="stage" class="stage">
        <div id="board" class="board"></div>
        <!-- Tutorial da primeira partida: a mão mostra o primeiro movimento -->
        <div id="tutorial" class="tutorial" hidden aria-hidden="true">
          <div class="tut-from"></div>
          <div class="tut-to"></div>
          <div class="tut-ghost"></div>
          <svg class="tut-hand" viewBox="0 0 70 84"><path class="tut-hand-fill" d="M22 40V8a6 6 0 0 1 12 0v22a6 6 0 0 1 11 2v2a5.5 5.5 0 0 1 10 2v1a5 5 0 0 1 9 3v14c0 14-9 24-22 24h-6c-9 0-14-5-18-12L8 51a5.5 5.5 0 0 1 9-6l5 5Z"/><path class="tut-hand-line" d="M34 30v9M45 34v6M55 37v5"/></svg>
        </div>
        <p id="tut-tip" class="tut-tip" role="status" hidden></p>
      </div>
    </section>

    <!-- Vitória -->
    <div id="win" class="overlay" hidden>
      <div class="win-card">
        <p class="win-kicker" id="win-kicker">Nível 1 concluído</p>
        <h2 id="win-title"></h2>
        <p class="win-reward" id="win-reward"></p>
        <button id="btn-continue" class="play-btn" data-i18n="continue">Continuar</button>
      </div>
    </div>

    <!-- Coleção -->
    <div id="gallery" class="overlay sheet" hidden>
      <div class="sheet-card">
        <header><h2 data-i18n="collection">Coleção</h2><button class="icon-btn close" data-close data-i18n-aria="close" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
        <div id="gallery-grid" class="gallery-grid"></div>
      </div>
    </div>
    <div id="viewer" class="overlay" hidden>
      <figure class="viewer"><img id="viewer-img" alt="" /><figcaption id="viewer-cap"></figcaption></figure>
    </div>

    <!-- Configurações -->
    <div id="settings" class="overlay sheet" hidden>
      <div class="sheet-card small">
        <header><h2 data-i18n="settings">Configurações</h2><button class="icon-btn close" data-close data-i18n-aria="close" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
        <div class="settings-list">
          <label class="setting">
            <svg class="setting-icon" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
            <span data-i18n="music">Música</span>
            <input type="checkbox" id="opt-music" class="switch" />
          </label>
          <label class="setting">
            <svg class="setting-icon" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
            <span data-i18n="sounds">Efeitos sonoros</span>
            <input type="checkbox" id="opt-sfx" class="switch" />
          </label>
          <button id="btn-language" class="setting setting-btn">
            <svg class="setting-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
            <span data-i18n="language">Idioma</span>
            <span class="lang-current"><span id="lang-flag" class="flag"></span><span id="lang-name"></span></span>
          </button>
        </div>
        <p class="muted" data-i18n="savedHere">O progresso fica salvo neste navegador.</p>
        <button id="btn-reset" class="danger-btn" data-i18n="reset">Apagar progresso</button>
        <p id="build" class="build"></p>
      </div>
    </div>

    <!-- Escolha de idioma -->
    <div id="languages" class="overlay sheet" hidden>
      <div class="sheet-card">
        <header><h2 data-i18n="chooseLanguage">Escolha o idioma</h2><button class="icon-btn close" data-close data-i18n-aria="close" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
        <div id="lang-grid" class="lang-grid"></div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
